name: Secret scan

# Fails the build if a credential is committed. Runs the gitleaks CLI directly
# (pinned version + verified checksum) so no third-party action or license key
# is needed. Reusable as-is in any ISNTX repo.
#
# Findings are printed REDACTED. If this job fails: treat the key as
# compromised, rotate it at the provider, then remove it from the branch.

on:
  push:
    branches: ["main", "autopilot", "autopilot/**", "autopilot-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan git history
        run: |
          set -euo pipefail
          # Default ruleset. Add a .gitleaks.toml only for narrow, reviewed allowlists.
          ./gitleaks git . --redact --verbose --exit-code 1 --report-format sarif --report-path gitleaks.sarif

      - name: Upload report (redacted)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
